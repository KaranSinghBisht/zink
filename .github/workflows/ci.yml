name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod

  wallet-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify patch against pinned zcash-devtool commit
        env:
          DEVTOOL_COMMIT: c8322f7e71ae46ab24801a721523ba83b27d911b
        run: |
          git init "$RUNNER_TEMP/zcash-devtool"
          git -C "$RUNNER_TEMP/zcash-devtool" fetch --depth=1 https://github.com/zcash/zcash-devtool.git "$DEVTOOL_COMMIT"
          git -C "$RUNNER_TEMP/zcash-devtool" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/zcash-devtool" apply --check "$GITHUB_WORKSPACE/patches/zcash-devtool-zink.patch"
