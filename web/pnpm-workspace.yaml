# Force the patched PostCSS (GHSA-qx2v-qp2m-jg93) over Next.js's pinned 8.4.31.
overrides:
  postcss: ">=8.5.10"

# Native modules that are allowed to run install/build scripts.
# allowBuilds is the pnpm 11 format; onlyBuiltDependencies covers pnpm 9/10.
allowBuilds:
  better-sqlite3: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - better-sqlite3
  - sharp
  - unrs-resolver
